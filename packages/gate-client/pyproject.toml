[project]
name = "gate-client"
version = "0.1.0"
description = "System-1 gate client. TypeSafe Python SDK against local Ollama Nimble. Fail-closed deny."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typesafe-sdk>=0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gate_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
