[project]
name = "e2e-demo"
version = "0.1.0"
description = "Scripted demo path: pinned flip pairs, gate decisions, stub observations, and the authority-flip report."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
e2e_demo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "../gate-client/src", "../gate-enforcement/src"]
